name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate Supabase secrets
        run: |
          HAS_SUPABASE=false
          HAS_WEBSOCKET=false

          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            HAS_SUPABASE=true
          fi

          if [ -n "$VITE_WS_URL" ]; then
            HAS_WEBSOCKET=true
          fi

          if [ "$HAS_SUPABASE" != "true" ] && [ "$HAS_WEBSOCKET" != "true" ]; then
            echo "Missing multiplayer backend configuration."
            echo "Set either Supabase secrets (VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY)"
            echo "or an external websocket endpoint (VITE_WS_URL)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4